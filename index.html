<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Juego de Memorama - Una PWA divertida para ejercitar la memoria">
    <meta name="theme-color" content="#8BBEE7">
    <title>Memorama - Juego de Memoria</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Memorama">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <h1 class="game-title">🧠 Memorama</h1>
            <div class="stats">
                <div class="stat">
                    <span class="stat-label">Movimientos</span>
                    <span class="stat-value" id="moves">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Pares</span>
                    <span class="stat-value" id="pairs">0/8</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Tiempo</span>
                    <span class="stat-value" id="timer">00:00</span>
                </div>
            </div>
        </header>

        <main class="main">
            <div class="game-board" id="gameBoard" role="grid" aria-label="Tablero de Memorama">
                <!-- Las cartas se generarán dinámicamente con JavaScript -->
            </div>

            <div class="game-controls">
                <button class="btn btn-primary" id="newGameBtn" aria-label="Nuevo juego">
                    🔄 Nuevo Juego
                </button>
                <button class="btn btn-secondary" id="installBtn" style="display: none;" aria-label="Instalar app">
                    📱 Instalar App
                </button>
            </div>

            <div class="game-info" id="gameInfo" aria-live="polite">
                <p>Encuentra todas las parejas haciendo clic en las cartas.</p>
            </div>
        </main>

        <footer class="footer">
            <p>Desarrollado como PWA - Actividad Unidad 4</p>
        </footer>
    </div>

    <!-- Modal de victoria -->
    <div class="modal" id="winModal" role="dialog" aria-labelledby="winTitle" aria-modal="true" hidden>
        <div class="modal-content">
            <h2 id="winTitle">🎉 ¡Felicidades!</h2>
            <p>Has completado el juego en <strong id="finalMoves">0</strong> movimientos y <strong id="finalTime">00:00</strong>.</p>
            <button class="btn btn-primary" id="playAgainBtn">Jugar de nuevo</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        // Registrar Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(reg => console.log('Service Worker registrado:', reg.scope))
                    .catch(err => console.log('Error al registrar SW:', err));
            });
        }

        // Manejar instalación PWA
        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'inline-block';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log(`Usuario ${outcome === 'accepted' ? 'aceptó' : 'rechazó'} la instalación`);
                deferredPrompt = null;
                installBtn.style.display = 'none';
            }
        });

        window.addEventListener('appinstalled', () => {
            console.log('PWA instalada correctamente');
            installBtn.style.display = 'none';
        });
    </script>
</body>
</html>
