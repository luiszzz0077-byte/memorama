<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo redondeado -->
  <rect x="32" y="32" width="448" height="448" rx="75" ry="75" fill="#8BBEE7"/>

  <!-- Cerebro estilizado -->
  <g transform="translate(256, 256)">
    <!-- Hemisferio izquierdo -->
    <path d="M-130,0
             C-130,-80 -50,-135 25,-135
             C80,-135 135,-80 135,0
             C135,80 80,135 25,135
             C-25,135 -130,80 -130,0
             Z" fill="#6AB0E0"/>

    <!-- Hemisferio derecho -->
    <path d="M130,0
             C130,-80 50,-135 -25,-135
             C-80,-135 -135,-80 -135,0
             C-135,80 -80,135 25,135
             C80,135 135,80 130,0
             Z" fill="#6AB0E0"/>

    <!-- Surcos del cerebro -->
    <g stroke="#5A9FD4" stroke-width="5" fill="none" stroke-linecap="round">
      <!-- Surcos lado izquierdo -->
      <path d="M-105,-55 Q-80,-30 -50,-15"/>
      <path d="M-105,0 Q-80,30 -50,55"/>
      <path d="M-105,55 Q-80,80 -50,95"/>

      <!-- Surcos lado derecho -->
      <path d="M105,-55 Q80,-30 50,-15"/>
      <path d="M105,0 Q80,30 50,55"/>
      <path d="M105,55 Q80,80 50,95"/>

      <!-- Línea central -->
      <path d="M0,-120 Q0,0 0,120" stroke="#5A9FD4" stroke-width="7"/>
    </g>

    <!-- Puntos de conexión neuronal (estilo memoria) -->
    <g fill="#FFFFFF" opacity="0.9">
      <circle cx="-90" cy="-65" r="8"/>
      <circle cx="-65" cy="15" r="7"/>
      <circle cx="-100" cy="55" r="6"/>
      <circle cx="90" cy="-65" r="8"/>
      <circle cx="65" cy="15" r="7"/>
      <circle cx="100" cy="55" r="6"/>
    </g>
  </g>

  <!-- Brillo superior -->
  <ellipse cx="256" cy="130" rx="135" ry="40" fill="white" opacity="0.15"/>
</svg>